name: "DPDPGuard Multi-Regulation Privacy Compliance Audit"
description: "Scan a codebase for the pattern-matchable privacy rules in the DPDPGuard audit catalog (5 of 26: PII in logs and URLs, hardcoded credentials, plaintext transport, weak password storage). Reports candidates requiring confirmation, not a compliance determination."
author: "DPDPGuard Team"
inputs:
  regulations:
    description: "Comma-separated list of regulations to audit (dpdp,gdpr,ccpa,pdpa)"
    required: false
    default: "dpdp,gdpr,ccpa,pdpa"
  fail-on:
    description: "Severity threshold to fail the build (critical|high|medium|low|never)"
    required: false
    default: "high"
  config:
    description: "Path to .dpdpguard.yaml config file"
    required: false
    default: ".dpdpguard.yaml"
runs:
  using: "node20"
  main: "bin/audit-ci.js"
