name: Publish

# Publishes @dpdpguard/claude-code-plugin to npm using Trusted Publishing
# (OIDC). No npm token is stored in this repository — npm exchanges the
# short-lived GitHub OIDC token for publish rights, and attaches a provenance
# attestation automatically.
#
# One-time setup on npmjs.com (required before the first run):
#   Package settings -> Trusted Publisher -> GitHub Actions
#     Organization or user: dpdpguard
#     Repository:           claude-code-plugin
#     Workflow filename:    publish.yml
#     Environment:          npm-publish
#
# The workflow filename and environment must match exactly, or npm rejects the
# exchange. Renaming this file means updating the trusted publisher config.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Pack and validate without publishing"
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate plugin structure
        run: bun run validate

      - name: Check codex artefacts are in sync
        run: bun run sync:codex:check

      - name: Run tests
        run: bun test

      - name: Lint markdown
        run: bun run lint

      - name: Read package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$VERSION'."
            exit 1
          fi
          echo "Tag $TAG matches package version $VERSION."

      - name: Verify this version is not already published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name=$(node -p "require('./package.json').name")
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$name@$VERSION is already published to npm."
            exit 1
          fi
          echo "$name@$VERSION is not yet published."

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@dpdpguard/claude-code-plugin
    permissions:
      contents: read
      # Required for Trusted Publishing: lets the job mint the OIDC token that
      # npm exchanges for short-lived publish credentials.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        # Trusted Publishing requires npm >= 11.5.1; the bundled npm is older.
        run: |
          npm install -g npm@latest
          npm --version

      - name: Pack and inspect tarball
        run: npm pack --dry-run

      - name: Publish
        if: github.event_name == 'release' || inputs.dry-run == false
        # No NODE_AUTH_TOKEN: authentication comes from the OIDC exchange.
        # Provenance is attached automatically under Trusted Publishing.
        run: npm publish --access public

      - name: Dry run only
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: echo "Dry run — nothing was published. Re-run with dry-run disabled to publish."

      - name: Summary
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          {
            echo "### Publish"
            echo ""
            echo "- Package: \`@dpdpguard/claude-code-plugin\`"
            echo "- Version: \`$VERSION\`"
            echo "- Auth: Trusted Publishing (OIDC), no stored token"
          } >> "$GITHUB_STEP_SUMMARY"
